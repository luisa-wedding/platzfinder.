<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unsere Hochzeit – Finde deinen Platz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {
    --ivory: #fbf7f2; --blush: #f4dfda; --blush-deep: #eac7c0; --rose: #c97b84; --rose-deep: #b25f6b;
    --sage: #9caf88; --sage-deep: #7e9370; --gold: #c9a05c; --gold-soft: #ddbe8c; --ink: #3d3436; --ink-soft: #7a6f6a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Jost", sans-serif; font-weight: 400; color: var(--ink); background-color: var(--ivory);
    background-image: radial-gradient(circle at 15% 10%, rgba(201, 123, 132, 0.10) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(156, 175, 136, 0.12) 0%, transparent 50%);
    -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 3rem 1.25rem;
  }
  .display { font-family: "Cormorant Garamond", serif; font-style: italic; }
  .wrap { position: relative; width: 100%; max-width: 26rem; }
  .card {
    position: relative; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 28px;
    box-shadow: 0 10px 40px -15px rgba(61, 52, 54, 0.25); padding: 2.75rem 2.25rem; text-align: center;
    animation: fadeUp 0.7s ease-out both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  h1.title { font-size: 2.5rem; margin: 0.25rem 0 0; }
  h2.subtitle { font-size: 1.7rem; margin: 0; }
  p.lede { color: var(--ink-soft); line-height: 1.55; margin: 0.75rem 0 0; }
  .divider { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin: 1.75rem 0; }
  .divider .line { height: 1px; width: 2.5rem; background: rgba(221, 190, 140, 0.7); }
  form { text-align: left; }
  label { display: block; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.5rem; }
  input[type="text"] {
    width: 100%; border: 1px solid rgba(234, 199, 192, 0.6); background: #fff; border-radius: 16px;
    padding: 0.9rem 1.2rem; font-family: inherit; font-size: 1rem; color: var(--ink); outline: none; transition: border-color 0.2s;
  }
  input[type="text"]::placeholder { color: rgba(122, 111, 106, 0.5); }
  input[type="text"]:focus { border-color: var(--rose); }
  button { font-family: inherit; cursor: pointer; }
  .btn-primary {
    width: 100%; margin-top: 1rem; border: none; border-radius: 16px; background: var(--rose); color: #fff;
    font-weight: 500; letter-spacing: 0.02em; padding: 0.9rem 1.2rem; font-size: 1rem; transition: background 0.2s, opacity 0.2s;
  }
  .btn-primary:hover { background: var(--rose-deep); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .link-btn { background: none; border: none; margin-top: 1.75rem; font-size: 0.9rem; color: var(--ink-soft); text-decoration: underline; text-decoration-color: var(--gold-soft); text-underline-offset: 4px; }
  .link-btn:hover { color: var(--ink); }
  .seat-box { margin-top: 1.5rem; background: rgba(244, 223, 218, 0.5); border: 1px solid rgba(234, 199, 192, 0.5); border-radius: 16px; padding: 1.4rem 1.4rem; }
  .seat-box .eyebrow { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(122, 111, 106, 0.8); }
  .seat-box .seat-name { margin-top: 0.4rem; font-family: "Cormorant Garamond", serif; font-size: 1.7rem; }
  .choice-btn {
    display: block; width: 100%; text-align: left; border: 1px solid rgba(234, 199, 192, 0.6); background: #fff;
    border-radius: 16px; padding: 0.9rem 1.2rem; font-size: 1rem; color: var(--ink); margin-top: 0.7rem; transition: border-color 0.2s, background 0.2s;
  }
  .choice-btn:hover { border-color: var(--rose); background: rgba(244, 223, 218, 0.3); }
  .footnote { margin-top: 1.5rem; text-align: center; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(122, 111, 106, 0.7); }
  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.5s ease-out both; }
  .wreath-stroke { stroke-dasharray: 340; stroke-dashoffset: 340; animation: wreathDraw 1.6s ease-out forwards; }
  .wreath-stroke.delay { animation-delay: 0.15s; }
  @keyframes wreathDraw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; } }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }

  .lang-pill { border: 1px solid var(--blush-deep); background: #fff; color: var(--ink-soft); border-radius: 999px; padding: 0.3rem 0.85rem; font-size: 0.75rem; cursor: pointer; font-family: inherit; }
  .lang-pill.active { background: var(--rose); border-color: var(--rose); color: #fff; }
  #lang-switcher-el { display: flex; gap: 0.35rem; z-index: 16; filter: drop-shadow(0 4px 10px rgba(61,52,54,0.15)); }

  #decorations-layer { position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 15; }
  .deco { position: absolute; filter: drop-shadow(0 6px 14px rgba(61, 52, 54, 0.22)); }
  .deco img, .deco svg { width: 100%; height: 100%; display: block; }

  .room-map-wrap { margin-top: 1.5rem; text-align: left; }
  .room-map-label { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.6rem; text-align: center; }
  .room-map { position: relative; width: 100%; aspect-ratio: 4 / 3; background: rgba(255, 255, 255, 0.55); border: 1px solid rgba(234, 199, 192, 0.5); border-radius: 18px; overflow: hidden; }
  .room-obj {
    position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--ink-soft); overflow: visible;
  }
  .room-obj .name-label { padding: 0 3px; word-break: break-word; hyphens: auto; }
  .room-obj.table { border-radius: 50%; background: rgba(156, 175, 136, 0.25); border: 1.5px solid rgba(156, 175, 136, 0.6); line-height: 1.1; }
  .room-obj.table.rect { border-radius: 10px; }
  .room-obj.table.highlight { background: var(--rose); border-color: var(--rose-deep); color: #fff; font-weight: 500; box-shadow: 0 0 0 6px rgba(201, 123, 132, 0.22); animation: pulseTable 1.8s ease-in-out infinite; }
  @keyframes pulseTable { 0%, 100% { box-shadow: 0 0 0 6px rgba(201, 123, 132, 0.22); } 50% { box-shadow: 0 0 0 10px rgba(201, 123, 132, 0.12); } }
  .room-obj.brautpaar, .room-obj.door, .room-obj.toilet { font-size: 0.5rem; color: var(--ink-soft); }
  .room-obj .icon-wrap { width: 55%; height: 55%; flex-shrink: 0; }
</style>
</head>
<body>

<div class="wrap">
  <div id="decorations-layer"></div>

  <div class="card" id="card">

    <!-- Willkommen -->
    <div class="view active" id="view-welcome">
      <div id="monogram-slot" style="margin:0 auto;display:block;text-align:center;"></div>

      <h1 class="title display" id="t-welcomeTitle">Willkommen</h1>
      <p class="lede" id="t-welcomeText"></p>
      <div class="divider"><span class="line"></span>
        <svg width="14" height="13" viewBox="0 0 14 13"><path d="M7 12 C 2 8.5, 0 6, 0 3.6 C 0 1.4, 2.6 0, 4.4 1.5 C 5.4 2.3, 7 3.6, 7 3.6 C 7 3.6, 8.6 2.3, 9.6 1.5 C 11.4 0, 14 1.4, 14 3.6 C 14 6, 12 8.5, 7 12 Z" fill="#C97B84"/></svg>
        <span class="line"></span>
      </div>
      <form id="name-form">
        <label for="guest-name" id="t-nameLabel">Dein Name</label>
        <input type="text" id="guest-name" autocomplete="name" autofocus />
        <button type="submit" class="btn-primary" id="submit-btn" disabled></button>
      </form>
    </div>

    <!-- Laden -->
    <div class="view" id="view-loading">
      <p class="display" id="t-loadingText" style="font-size:1.2rem;color:var(--ink-soft);padding:2rem 0;"></p>
    </div>

    <!-- Treffer -->
    <div class="view" id="view-found">
      <svg width="32" height="30" viewBox="0 0 14 13" style="display:block;margin:0 auto 0.5rem;">
        <path d="M7 12 C 2 8.5, 0 6, 0 3.6 C 0 1.4, 2.6 0, 4.4 1.5 C 5.4 2.3, 7 3.6, 7 3.6 C 7 3.6, 8.6 2.3, 9.6 1.5 C 11.4 0, 14 1.4, 14 3.6 C 14 6, 12 8.5, 7 12 Z" fill="#C97B84"/>
      </svg>
      <h2 class="subtitle display" id="found-greeting">Hallo!</h2>
      <p class="lede" id="t-foundText"></p>
      <div class="seat-box">
        <p class="eyebrow" id="t-seatLabel"></p>
        <p class="seat-name" id="found-seat"></p>
      </div>
      <div class="room-map-wrap" id="room-map-wrap" hidden>
        <p class="room-map-label" id="t-roomMapLabel"></p>
        <div class="room-map" id="room-map"></div>
      </div>
      <button class="link-btn" id="t-resetLink" onclick="resetView()"></button>
    </div>

    <!-- Mehrdeutig -->
    <div class="view" id="view-ambiguous">
      <h2 class="subtitle display" id="t-ambiguousTitle"></h2>
      <p class="lede" id="t-ambiguousText"></p>
      <div id="ambiguous-list" style="margin-top:1rem;"></div>
      <button class="link-btn" id="t-ambiguousReset" onclick="resetView()"></button>
    </div>

    <!-- Nicht gefunden -->
    <div class="view" id="view-notfound">
      <h2 class="subtitle display" id="t-notFoundTitle"></h2>
      <p class="lede" id="t-notFoundText"></p>
      <button class="btn-primary" id="t-retryButton" onclick="resetView()"></button>
    </div>

    <!-- Fehler -->
    <div class="view" id="view-error">
      <h2 class="subtitle display">Kurze Verzögerung</h2>
      <p class="lede">Die Gästeliste konnte nicht geladen werden. Bitte lade die Seite neu.</p>
      <button class="btn-primary" onclick="location.reload()">Seite neu laden</button>
    </div>

    <!-- kleines Gimmick für zwei Gäste, hart codiert -->
    <div class="view" id="view-gimmick">
      <img src="./assets/gimmick.jpg" alt="" style="width:100%; border-radius:18px; display:block; margin-bottom:1.2rem;" />
      <button class="btn-primary" id="gimmick-continue">Weiter zu meinem Platz</button>
    </div>

  </div>
  <p class="footnote" id="t-footnote"></p>
</div>

<script>
  // ---------- Cache-Busting ----------
  const CACHE_BUST = "?v=" + Date.now();
  function freshFetch(url) { return fetch(url + CACHE_BUST, { cache: "no-store" }); }

  // ---------- Shape-Pfade (Herz/Stern/Blume als je EIN Pfad) ----------
  const SHAPE_PATHS = {
    heart: "M50 92 C15 68,0 48,0 28 C0 10,20 2,35 12 C42 17,50 26,50 26 C50 26,58 17,65 12 C80 2,100 10,100 28 C100 48,85 68,50 92 Z",
    star: "M50 2 L61.8 33.8 L95.6 35.2 L69 56.2 L78.2 88.9 L50 70 L21.8 88.9 L31 56.2 L4.3 35.2 L38.2 33.8 Z",
    flower: "M50,50 Q66,29 50,8 Q34,29 50,50 Q74.9,58.7 89.9,37 Q65,28.3 50,50 Q49.4,76.4 74.7,84 Q75.3,57.6 50,50 Q24.7,57.6 25.3,84 Q50.6,76.4 50,50 Q35,28.3 10,37 Q25.1,58.7 50,50 Z"
  };
  function shapeFillSvg(shape, color) {
    const fill = color ? color : `url(#g-${shape})`;
    const grad = color ? "" : `<defs><linearGradient id="g-${shape}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#EAC7C0"/><stop offset="1" stop-color="${shape === 'flower' ? '#9CAF88' : '#C97B84'}"/>
      </linearGradient></defs>`;
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${grad}<path d="${SHAPE_PATHS[shape]}" fill="${fill}" /></svg>`;
  }
  function shapeOutlineSvg(shape, color) {
    return `<svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%;"><path d="${SHAPE_PATHS[shape]}" fill="none" stroke="${color}" stroke-width="2" /></svg>`;
  }
  function wreathLeavesSvg(color) {
    let out = "";
    for (let i = 0; i < 16; i++) {
      const a = i * (360 / 16);
      const rad = (a * Math.PI) / 180;
      const lx = 50 + 42 * Math.cos(rad), ly = 50 + 42 * Math.sin(rad);
      out += `<ellipse cx="${lx}" cy="${ly}" rx="7" ry="3" fill="${color}" opacity="0.85" transform="rotate(${a + 90} ${lx} ${ly})"/>`;
    }
    return out;
  }
  function waxSealSvg(color, initials) {
    return `<svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="${color}"/>
      <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(0,0,0,0.15)"/>
      <text x="50" y="59" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="30" fill="#fff">${initials}</text>
    </svg>`;
  }
  function decoVisualHtml(d) {
    const photoSrc = d.image ? "./assets/" + d.image + CACHE_BUST : null;
    if (d.shape === "wreath") {
      const leafColor = d.color || "#9CAF88";
      const photoLayer = photoSrc ? `<img src="${photoSrc}" style="position:absolute;inset:9%;width:82%;height:82%;border-radius:50%;object-fit:cover;" />` : "";
      return `<div style="position:relative;width:100%;height:100%;">${photoLayer}<svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%;">${wreathLeavesSvg(leafColor)}</svg></div>`;
    }
    if (d.shape === "seal") {
      return waxSealSvg(d.color || "#B25F6B", monogramText || "I & L");
    }
    if (photoSrc) {
      return `<div style="position:relative;width:100%;height:100%;"><img src="${photoSrc}" style="width:100%;height:100%;" />${d.color ? shapeOutlineSvg(d.shape, d.color) : ""}</div>`;
    }
    return shapeFillSvg(d.shape, d.color);
  }
  function doorIconSvg(color) {
    return `<svg viewBox="0 0 24 24"><path d="M6 3h9a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6" fill="none" stroke="${color}" stroke-width="1.4"/>
      <path d="M15 4 A16 16 0 0 1 15 20" fill="none" stroke="${color}" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
      <circle cx="13" cy="12" r="0.7" fill="${color}"/></svg>`;
  }
  function toiletIconSvg(color) {
    return `<svg viewBox="0 0 24 24"><path d="M8 3h8a2 2 0 0 1 2 2v2H6V5a2 2 0 0 1 2-2z" fill="${color}"/>
      <path d="M6 8h12l-1.3 9.5A3 3 0 0 1 13.7 20h-3.4a3 3 0 0 1-3-2.5L6 8z" fill="none" stroke="${color}" stroke-width="1.3"/></svg>`;
  }
  function ringsIconSvg(color) {
    return `<svg viewBox="0 0 40 24"><circle cx="15" cy="12" r="9" fill="none" stroke="${color}" stroke-width="2.6"/><circle cx="25" cy="12" r="9" fill="none" stroke="${color}" stroke-width="2.6"/></svg>`;
  }

  // ---------- Content / Sprache ----------
  let content = null;
  let currentLang = "de";
  let monogramText = "I & L";

  freshFetch("./content.json")
    .then((res) => (res.ok ? res.json() : null))
    .then((data) => {
      content = data;
      if (!content) return;
      monogramText = content.monogramText || "I & L";
      currentLang = (content.activeLanguages && content.activeLanguages[0]) || "de";
      applyLanguage(currentLang);
      renderMonogram();
      renderLangSwitcher();
    })
    .catch(() => {});

  function renderLangSwitcher() {
    const existing = document.getElementById("lang-switcher-el");
    if (existing) existing.remove();
    if (!content || !content.languageSwitcher || !content.languageSwitcher.enabled) return;
    if (!content.activeLanguages || content.activeLanguages.length <= 1) return;
    const pos = content.languageSwitcher;
    const el = document.createElement("div");
    el.id = "lang-switcher-el";
    el.style.position = "absolute";
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";
    el.style.transform = "translate(-50%, -50%)";
    content.activeLanguages.forEach((code) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "lang-pill" + (code === currentLang ? " active" : "");
      btn.textContent = (content[code] && content[code].label) || code;
      btn.onclick = () => { currentLang = code; applyLanguage(code); renderLangSwitcher(); };
      el.appendChild(btn);
    });
    document.querySelector(".wrap").appendChild(el);
  }

  function applyLanguage(code, guestName) {
    if (!content || !content[code]) return;
    const t = content[code];
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
    set("t-welcomeTitle", t.welcomeTitle);
    set("t-welcomeText", t.welcomeText);
    set("t-nameLabel", t.nameLabel);
    document.getElementById("guest-name").placeholder = t.namePlaceholder;
    set("submit-btn", t.buttonText);
    set("t-loadingText", t.loadingText);
    set("t-foundText", t.foundText);
    set("t-seatLabel", t.seatLabel);
    set("t-roomMapLabel", t.roomMapLabel);
    set("t-resetLink", t.resetLink);
    set("t-ambiguousTitle", t.ambiguousTitle);
    set("t-ambiguousText", t.ambiguousText);
    set("t-ambiguousReset", t.ambiguousReset);
    set("t-notFoundTitle", t.notFoundTitle);
    set("t-notFoundText", t.notFoundText);
    set("t-retryButton", t.retryButton);
    set("t-footnote", t.footnote);
    if (guestName !== undefined) {
      document.getElementById("found-greeting").textContent = t.foundGreeting.replace("{name}", guestName);
    }
  }
  function renderMonogram() {
    const slot = document.getElementById("monogram-slot");
    if (content && content.monogramImage) {
      slot.innerHTML = `<img src="./assets/${content.monogramImage}${CACHE_BUST}" style="max-width:220px;width:60%;height:auto;margin:0 auto;display:block;" />`;
      return;
    }
    slot.innerHTML = `
      <svg viewBox="0 0 320 200" width="190" height="119" style="margin:0 auto;display:block" aria-hidden="true">
        <path class="wreath-stroke" d="M160 100 C 120 85, 90 95, 60 75 C 40 62, 35 45, 42 28" stroke="#9CAF88" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path class="wreath-stroke delay" d="M160 100 C 200 85, 230 95, 260 75 C 280 62, 285 45, 278 28" stroke="#9CAF88" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="95" cy="90" rx="7" ry="3" fill="#9CAF88" opacity="0.7" transform="rotate(-20 95 90)"/>
        <ellipse cx="70" cy="80" rx="6" ry="2.6" fill="#9CAF88" opacity="0.6" transform="rotate(10 70 80)"/>
        <ellipse cx="225" cy="90" rx="7" ry="3" fill="#9CAF88" opacity="0.7" transform="rotate(20 225 90)"/>
        <ellipse cx="250" cy="80" rx="6" ry="2.6" fill="#9CAF88" opacity="0.6" transform="rotate(-10 250 80)"/>
        <g transform="translate(42 28)"><circle cx="-5" cy="-3" r="4" fill="#EAC7C0"/><circle cx="5" cy="-3" r="4" fill="#EAC7C0"/><circle cx="0" cy="4" r="4" fill="#EAC7C0"/><circle cx="0" cy="0" r="3" fill="#C9A05C"/></g>
        <g transform="translate(278 28)"><circle cx="-5" cy="-3" r="4" fill="#EAC7C0"/><circle cx="5" cy="-3" r="4" fill="#EAC7C0"/><circle cx="0" cy="4" r="4" fill="#EAC7C0"/><circle cx="0" cy="0" r="3" fill="#C9A05C"/></g>
        <path d="M160 118 c -6 -8, -18 -5, -18 4 c 0 7, 10 12, 18 19 c 8 -7, 18 -12, 18 -19 c 0 -9, -12 -12, -18 -4 z" fill="#C97B84" opacity="0.85"/>
        <text x="160" y="82" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="26" fill="#3D3436">${monogramText}</text>
      </svg>`;
  }

  // ---------- Dekorationen ----------
  let decorations = [];
  freshFetch("./decorations.json")
    .then((res) => (res.ok ? res.json() : []))
    .then((data) => { decorations = Array.isArray(data) ? data : []; renderDecorationsForView("start"); })
    .catch(() => {});

  function renderDecorationsForView(view) {
    const layer = document.getElementById("decorations-layer");
    layer.innerHTML = "";
    decorations.filter((d) => (d.view || "start") === view).forEach((d) => {
      const el = document.createElement("div");
      el.className = "deco";
      el.style.left = d.x + "%";
      el.style.top = d.y + "%";
      el.style.width = d.size + "%";
      el.style.aspectRatio = "1 / 1";
      el.style.opacity = (d.opacity !== undefined ? d.opacity : 100) / 100;
      el.style.transform = `translate(-50%, -50%) rotate(${d.rotation || 0}deg)`;
      el.innerHTML = decoVisualHtml(d);
      layer.appendChild(el);
    });
  }

  // ---------- Raum-Layout ----------
  let roomObjects = [];
  freshFetch("./layout.json")
    .then((res) => (res.ok ? res.json() : []))
    .then((data) => { roomObjects = Array.isArray(data) ? data : []; })
    .catch(() => { roomObjects = []; });

  function chipFontSize(nameLength) {
    let base = 11 - Math.max(0, nameLength - 12) * 0.15;
    return Math.max(6.5, Math.min(11, base)) + "px";
  }

  function renderRoomMap(seatName) {
    const wrap = document.getElementById("room-map-wrap");
    const map = document.getElementById("room-map");
    if (!roomObjects.length) { wrap.hidden = true; return; }
    map.innerHTML = "";
    const target = normalize(seatName || "");

    roomObjects.forEach((o) => {
      const el = document.createElement("div");
      el.style.left = o.x + "%"; el.style.top = o.y + "%";
      const rot = o.rotation || 0;

      if (o.type === "table") {
        el.className = "room-obj table" + (o.shape === "rect" ? " rect" : "");
        if (normalize(o.name) === target) el.className += " highlight";
        el.style.width = o.w + "%"; el.style.height = o.h + "%";
        el.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
        el.style.fontSize = chipFontSize(o.name.length);
        el.innerHTML = `<span class="name-label">${o.name}</span>`;
      } else if (o.type === "brautpaar") {
        el.className = "room-obj brautpaar";
        el.style.width = (o.w || 11) + "%"; el.style.height = (o.h || 7) + "%";
        el.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
        el.innerHTML = `<div class="icon-wrap">${ringsIconSvg("#C9A05C")}</div>`;
      } else if (o.type === "door") {
        el.className = "room-obj door";
        el.style.width = (o.w || 8) + "%"; el.style.height = (o.h || 8) + "%";
        el.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
        el.innerHTML = `<div class="icon-wrap">${doorIconSvg("#7A6F6A")}</div><span class="name-label">${o.name || "Tür"}</span>`;
      } else if (o.type === "toilet") {
        el.className = "room-obj toilet";
        el.style.width = (o.w || 8) + "%"; el.style.height = (o.h || 8) + "%";
        el.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
        el.innerHTML = `<div class="icon-wrap">${toiletIconSvg("#7A6F6A")}</div><span class="name-label">${o.name || "WC"}</span>`;
      } else { return; }
      map.appendChild(el);
    });
    wrap.hidden = false;
  }

  // ---------- Gästeliste ----------
  let guests = [];
  let guestsReady = false;
  freshFetch("./guests.xlsx")
    .then((res) => { if (!res.ok) throw new Error("guests.xlsx nicht gefunden"); return res.arrayBuffer(); })
    .then((buffer) => {
      const workbook = XLSX.read(new Uint8Array(buffer), { type: "array" });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      guests = rows.map((row) => ({
        vorname: readColumn(row, ["vorname", "firstname", "first name"]),
        nachname: readColumn(row, ["nachname", "lastname", "last name", "name"]),
        tisch: readColumn(row, ["tisch", "platz", "table", "seat"]),
        sprache: readColumn(row, ["sprache", "language", "lang"])
      })).filter((g) => g.vorname || g.nachname);
      guestsReady = true;
    })
    .catch((err) => { console.error(err); guestsReady = false; });

  function readColumn(row, keys) {
    for (const key of Object.keys(row)) {
      if (keys.includes(key.trim().toLowerCase())) {
        const value = row[key];
        return value === undefined || value === null ? "" : String(value).trim();
      }
    }
    return "";
  }

  const MATCH_THRESHOLD = 0.6;
  const AMBIGUITY_MARGIN = 0.08;
  function normalize(input) {
    return input.toLowerCase().trim().replace(/ß/g, "ss").replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/\s+/g, " ");
  }
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n; if (n === 0) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    let curr = new Array(n + 1);
    for (let i = 1; i <= m; i++) {
      curr[0] = i;
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
      }
      [prev, curr] = [curr, prev];
    }
    return prev[n];
  }
  function similarity(a, b) {
    if (a === b) return 1;
    const maxLen = Math.max(a.length, b.length);
    if (maxLen === 0) return 1;
    return 1 - levenshtein(a, b) / maxLen;
  }
  function scoreGuest(inputNorm, guest) {
    const vorname = normalize(guest.vorname), nachname = normalize(guest.nachname);
    const full1 = `${vorname} ${nachname}`, full2 = `${nachname} ${vorname}`;
    const candidates = [full1, full2];
    if (!inputNorm.includes(" ")) candidates.push(vorname, nachname);
    let best = 0;
    for (const candidate of candidates) {
      best = Math.max(best, similarity(inputNorm, candidate));
      if (candidate.includes(inputNorm) && inputNorm.length >= 3) best = Math.max(best, 0.82);
    }
    return best;
  }
  function findSeat(inputName) {
    const inputNorm = normalize(inputName);
    if (!inputNorm) return { status: "not-found" };
    const exactMatches = guests.filter((g) => {
      const vorname = normalize(g.vorname), nachname = normalize(g.nachname);
      return inputNorm === `${vorname} ${nachname}` || inputNorm === `${nachname} ${vorname}`;
    });
    if (exactMatches.length === 1) return { status: "found", guest: exactMatches[0] };
    if (exactMatches.length > 1) return { status: "ambiguous", candidates: exactMatches };
    const scored = guests.map((guest) => ({ guest, score: scoreGuest(inputNorm, guest) })).sort((a, b) => b.score - a.score);
    if (scored.length === 0 || scored[0].score < MATCH_THRESHOLD) return { status: "not-found" };
    const topScore = scored[0].score;
    const close = scored.filter((s) => s.score >= topScore - AMBIGUITY_MARGIN && s.score >= MATCH_THRESHOLD);
    if (close.length === 1) return { status: "found", guest: close[0].guest };
    return { status: "ambiguous", candidates: close.map((c) => c.guest) };
  }

  const views = ["welcome", "loading", "found", "ambiguous", "notfound", "error", "gimmick"];
  function showView(name) {
    views.forEach((v) => document.getElementById("view-" + v).classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
    const switcherEl = document.getElementById("lang-switcher-el");
    if (switcherEl) switcherEl.style.display = name === "welcome" ? "flex" : "none";
  }

  // Kleines, verstecktes Gimmick für zwei bestimmte Gäste - bewusst nicht über die Config-Seite steuerbar.
  const GIMMICK_NAMES = ["marvin loeding", "henriette niermann"];
  function isGimmickGuest(guest) {
    return GIMMICK_NAMES.includes(normalize(`${guest.vorname} ${guest.nachname}`));
  }

  function resetView() {
    document.getElementById("guest-name").value = "";
    document.getElementById("submit-btn").disabled = true;
    if (content && content.activeLanguages) { currentLang = content.activeLanguages[0]; applyLanguage(currentLang); renderLangSwitcher(); }
    showView("welcome");
    renderDecorationsForView("start");
    document.getElementById("guest-name").focus();
  }
  function renderFound(guest) {
    if (isGimmickGuest(guest)) {
      showView("gimmick");
      document.getElementById("gimmick-continue").onclick = () => showFoundDetails(guest);
      return;
    }
    showFoundDetails(guest);
  }
  function showFoundDetails(guest) {
    let lang = currentLang;
    if (guest.sprache && content && content[guest.sprache]) lang = guest.sprache;
    currentLang = lang;
    applyLanguage(lang, guest.vorname);
    document.getElementById("found-seat").textContent = guest.tisch;
    renderRoomMap(guest.tisch);
    renderDecorationsForView("end");
    showView("found");
  }
  function renderAmbiguous(candidates) {
    const list = document.getElementById("ambiguous-list");
    list.innerHTML = "";
    candidates.forEach((c) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = `${c.vorname} ${c.nachname}`;
      btn.onclick = () => renderFound(c);
      list.appendChild(btn);
    });
    showView("ambiguous");
  }
  document.getElementById("guest-name").addEventListener("input", (e) => {
    document.getElementById("submit-btn").disabled = !e.target.value.trim();
  });
  document.getElementById("name-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("guest-name").value.trim();
    if (!name) return;
    showView("loading");
    setTimeout(() => {
      if (!guestsReady) { showView("error"); return; }
      const result = findSeat(name);
      if (result.status === "found") renderFound(result.guest);
      else if (result.status === "ambiguous") renderAmbiguous(result.candidates);
      else showView("notfound");
    }, 450);
  });
</script>
